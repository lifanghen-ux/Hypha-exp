job_name: hypha-exp-lhtb-langchain-hypha-single-v2
jobs_dir: /root/projects/Hypha-exp/outputs/lhtb
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - import_path: hypha_exp.benchmarks.lhtb:HyphaLHTBAgent
    model_name: hypha/deepseek
    override_timeout_sec: 5400
    kwargs:
      execution_mode: kernel_plan
      planner_timeout_sec: 300
      planned_actions:
        - type: shell
          command: "cd /app && pwd && find . -maxdepth 3 -type f | sort | head -120"
          timeout_sec: 30

datasets:
  - path: ./benchmarks/LHTB/tasks
    task_names:
      - langchain-version-migration
