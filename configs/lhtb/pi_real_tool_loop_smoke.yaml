job_name: hypha-exp-lhtb-pi-real-tool-loop-smoke-v5
jobs_dir: /root/projects/Hypha-exp/outputs/lhtb
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - import_path: hypha_exp.benchmarks.lhtb:PiRealLHTBAgent
    model_name: pi-real/deepseek
    override_timeout_sec: 180
    kwargs:
      max_tool_calls_per_phase: 4
      max_context_messages: 20
      helper_timeout_sec: 180
      max_shell_timeout_sec: 120

datasets:
  - path: ./benchmarks/LHTB/tasks
    task_names:
      - "2048"
