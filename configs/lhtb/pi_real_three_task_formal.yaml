job_name: hypha-exp-lhtb-pi-real-three-task-formal-v2
jobs_dir: /root/projects/Hypha-exp/outputs/lhtb
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - import_path: hypha_exp.benchmarks.lhtb:PiRealLHTBAgent
    model_name: pi-real/deepseek
    kwargs:
      max_tool_calls_per_phase: 4
      max_context_messages: 20
      max_saved_history_records: 30
      helper_timeout_sec: 180
      max_shell_timeout_sec: 120
      max_phases: 180
      max_model_calls: 360
      max_tool_calls: 720
      max_total_tokens: 3000000

datasets:
  - path: ./benchmarks/LHTB/tasks
    task_names:
      - langchain-version-migration
      - great-expectations-audit
      - document-table-layout-reconstruction
